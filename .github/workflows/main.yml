name: Build Xvfb (x86_64 + ARM64)

on:
  push:
    branches: [main]         # Runs when pushing to main
  workflow_dispatch:   # Manual trigger

permissions:
  contents: write

jobs:
  build_x86:
    runs-on: ubuntu-latest
    container:
      image: debian:10

    steps:
      - name: Fix Debian 10 repositories
        run: |
          sed -i 's|http://deb.debian.org/debian|http://archive.debian.org/debian|g' /etc/apt/sources.list
          sed -i 's|http://security.debian.org/debian-security|http://archive.debian.org/debian-security|g' /etc/apt/sources.list

          echo 'Acquire::Check-Valid-Until "false";' \
            > /etc/apt/apt.conf.d/99no-check-valid

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install base dependencies (host)
        run: |
          apt-get update
          apt-get install -y meson ninja-build pkg-config python3 python3-pip build-essential git x11-xkb-utils libjpeg-dev

      - name: Build project
        run: |
          bash .gitlab-ci/debian-install.sh
          meson setup build
          meson compile -C build

        continue-on-error: true

      - name: Show binary info
        run: |
          file build/hw/vfb/Xvfb || true
          file build/hw/xfree86/Xorg || true

      - name: Upload build artifact XVFB
        uses: actions/upload-artifact@v4
        if: success() || always()
        with:
          name: Xvfb_x86
          path: build/hw/vfb/Xvfb

      - name: Upload Xorg (if present)
        if: ${{ hashFiles('build/hw/xfree86/Xorg') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Xorg-x86
          path: build/hw/xfree86/Xorg

  build_arm64:
    runs-on: [self-hosted, arm64_d11]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Meson build cache
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-meson-build-${{ hashFiles('**/meson.build') }}
          restore-keys: |
            ${{ runner.os }}-meson-build-

      - name: Build project
        run: |
          meson setup build
          meson compile -C build

      - name: Show binary info
        run: |
          file build/hw/vfb/Xvfb || true
          file build/hw/xfree86/Xorg || true

      - name: Upload Xvfb (if present)
        if: ${{ hashFiles('build/hw/vfb/Xvfb') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Xvfb-arm64
          path: build/hw/vfb/Xvfb

      - name: Upload Xorg (if present)
        if: ${{ hashFiles('build/hw/xfree86/Xorg') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Xorg-arm64
          path: build/hw/xfree86/Xorg
  
  release:
    needs:
      - build_x86
      - build_arm64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y gh jq

      - name: Verify GH CLI Authentication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth status || echo "GH CLI will use GH_TOKEN from environment"

      - name: Get latest successful build run ID
        id: get_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id=$(gh run list \
            --workflow "Build Xvfb (x86_64 + ARM64)" \
            --branch main \
            --json databaseId,status,conclusion \
            -q '.[] | select(.status=="completed" and .conclusion=="success") | .databaseId' | head -n1)

          if [ -z "$run_id" ]; then
            echo "No successful build found" && exit 1
          fi

          echo "Found build run ID: $run_id"
          echo "run_id=$run_id" >> $GITHUB_OUTPUT

      - name: Download artifacts from latest successful build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir artifacts
          gh run download ${{ steps.get_run.outputs.run_id }} --dir artifacts
          echo "Downloaded artifacts:"
          ls -R artifacts

      - name: Zip top-level artifact folders
        run: |
          cd artifacts
          for folder in */ ; do
            folder_name=$(basename "$folder")
            zip -r "${folder_name}.zip" "$folder"
          done
          echo "Zipped artifacts:"
          ls -lh *.zip

      - name: Create or update release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name)
          # Check if release already exists
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release for tag $TAG already exists, updating..."
          else
            echo "Creating new release for tag $TAG..."
            gh release create "$TAG" --title "Release $TAG" --notes "Automated release for $TAG"
          fi

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name)
          for zip_file in artifacts/*.zip; do
            echo "Uploading $zip_file..."
            gh release upload "$TAG" "$zip_file" --clobber
          done