name: Build Xvfb debian test

on:
  push:
    tags:
      - "v-*"
  workflow_dispatch:

jobs:
  build_x86_legacy:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        debian: [10, 11, 12]

    container:
      image: debian:${{ matrix.debian }}

    steps:
      - uses: actions/checkout@v4

      # -----------------------------
      # Debian 10 archive fix
      # -----------------------------
      - name: Fix Debian 10 repositories
        if: matrix.debian == 10
        run: |
          sed -i 's|http://deb.debian.org/debian|http://archive.debian.org/debian|g' /etc/apt/sources.list
          sed -i 's|http://security.debian.org/debian-security|http://archive.debian.org/debian-security|g' /etc/apt/sources.list

          echo 'Acquire::Check-Valid-Until "false";' \
            > /etc/apt/apt.conf.d/99no-check-valid

      # -----------------------------
      # Dependencies
      # -----------------------------
      - name: Install dependencies
        run: |
          apt-get update

          apt-get install -y \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            python3-setuptools \
            build-essential \
            git \
            x11-xkb-utils \
            libjpeg-dev

          # Meson handling (Debian 10 may be old)
          apt-get install -y meson || pip3 install --break-system-packages meson

      # -----------------------------
      # Build
      # -----------------------------
      - name: Build project
        run: |
          bash .gitlab-ci/debian-install.sh
          meson setup build
          meson compile -C build
        continue-on-error: true

      # -----------------------------
      # Tests
      # -----------------------------
      - name: make
        run: make

      - name: make check
        run: make check

      - name: make distcheck
        run: make distcheck

      # -----------------------------
      # Artifacts
      # -----------------------------
      - name: Upload XVFB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Xvfb_x86_debian_${{ matrix.debian }}
          path: build/hw/vfb/Xvfb
