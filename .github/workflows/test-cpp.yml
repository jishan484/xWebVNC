name: Test Xvfb Binary

on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        debian:
          - 10
          - 11
          - 12
          - 13

    runs-on: ubuntu-latest

    container:
      image: debian:${{ matrix.debian }}

    steps:
      - name: Fix Debian 10 repositories
        if: matrix.debian == '10'
        run: |
          sed -i 's|http://deb.debian.org/debian|http://archive.debian.org/debian|g' /etc/apt/sources.list
          sed -i 's|http://security.debian.org/debian-security|http://archive.debian.org/debian-security|g' /etc/apt/sources.list

          echo 'Acquire::Check-Valid-Until "false";' \
            > /etc/apt/apt.conf.d/99no-check-valid

      - name: Install runtime dependencies
        run: |
          apt-get update

          apt-get install --no-install-recommends -y \
            curl \
            unzip \
            file \
            procps \
            ca-certificates \
            libxfont2 \
            x11-xkb-utils \
            x11-xserver-utils \
            libasound2 \
            libpulse0 \
            libpam0g \
            libpam-runtime \
            git

      - name: Install GitHub CLI
        run: |
          apt-get install -y curl gnupg

          mkdir -p /usr/share/keyrings

          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | gpg --dearmor \
            > /usr/share/keyrings/githubcli-archive-keyring.gpg

          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list

          apt-get update
          apt-get install -y gh

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest successful build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --workflow "Build Xvfb (x86_64 + ARM64)" \
            --branch main \
            --json databaseId,status,conclusion \
            -q '.[] | select(.status=="completed" and .conclusion=="success") | .databaseId' \
            | head -n1)

          echo "Using run: $RUN_ID"

          mkdir artifacts

          gh run download "$RUN_ID" \
            --name Xvfb_x86 \
            --dir artifacts

      - name: Locate binary
        run: |
          XVFB=$(find artifacts -type f | head -n1)

          test -n "$XVFB"

          chmod +x "$XVFB"

          echo "XVFB_BIN=$XVFB" >> "$GITHUB_ENV"

          file "$XVFB"

      - name: Show dependencies
        run: |
          ldd "$XVFB_BIN" || true

      - name: Start Xvfb
        run: |
          "$XVFB_BIN" :99 -screen 0 1024x768x24 &
          echo $! > xvfb.pid

          sleep 5

      - name: Verify process is alive
        run: |
          PID=$(cat xvfb.pid)

          kill -0 "$PID"

          echo "Process is alive"

      - name: Verify X socket exists
        run: |
          test -S /tmp/.X11-unix/X99

          echo "Socket exists"

      - name: Verify process still alive
        run: |
          PID=$(cat xvfb.pid)

          kill -0 "$PID"

          echo "Xvfb survived startup"

      - name: Success
        run: |
          echo "=================================================="
          echo "PASS: Debian ${{ matrix.debian }}"
          echo "=================================================="

      - name: Stop Xvfb
        if: always()
        run: |
          kill $(cat xvfb.pid) || true